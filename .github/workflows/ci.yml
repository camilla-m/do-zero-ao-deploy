name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        working-directory: apps/task-api
        run: pip install -r requirements-dev.txt

      - name: Roda testes
        working-directory: apps/task-api
        run: pytest -v
