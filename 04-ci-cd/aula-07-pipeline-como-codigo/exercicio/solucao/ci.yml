name: CI

on:
  push:
  pull_request:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      working-directory: apps/task-api

  build-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: apps/task-api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/task-api:latest
            ghcr.io/${{ github.repository }}/task-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Cria cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Permite ao cluster puxar do GHCR
        run: |
          kubectl create secret docker-registry ghcr-creds \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }}
          kubectl patch serviceaccount default \
            -p '{"imagePullSecrets": [{"name": "ghcr-creds"}]}'

      - name: Aplica manifests
        run: |
          kubectl create configmap task-api-config \
            --from-literal=LOG_LEVEL=info --from-literal=APP_NAME=task-api
          kubectl create secret generic task-api-secret \
            --from-literal=REDIS_URL=redis://cache:6379/0
          kubectl apply -f k8s/redis-deployment.yaml -f k8s/redis-service.yaml
          kubectl apply -f k8s/task-api-deployment.yaml -f k8s/task-api-service.yaml
          kubectl set image deployment/task-api \
            task-api=ghcr.io/${{ github.repository }}/task-api:${{ github.sha }}

      - name: Smoke test
        run: |
          kubectl rollout status deployment/redis --timeout=90s
          kubectl rollout status deployment/task-api --timeout=90s
          kubectl port-forward svc/task-api 8080:80 &
          sleep 3
          curl --fail http://localhost:8080/health
