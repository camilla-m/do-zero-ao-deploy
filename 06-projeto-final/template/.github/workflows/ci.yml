name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TODO: troque pelo setup da sua stack (ex: actions/setup-node, actions/setup-go...)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        working-directory: app # TODO: ajuste o caminho
        run: pip install -r requirements-dev.txt

      - name: Roda testes
        working-directory: app # TODO: ajuste o caminho
        run: pytest -v

  build-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app # TODO: ajuste o caminho
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/minha-app:latest
            ghcr.io/${{ github.repository }}/minha-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: ci

      # TODO: adapte pro seu smoke test -- ver .github/workflows/ci.yml deste
      # repositorio (raiz) como referencia completa e funcionando
      - name: Aplica manifests e testa
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/minha-app \
            minha-app=ghcr.io/${{ github.repository }}/minha-app:${{ github.sha }}
          kubectl rollout status deployment/minha-app --timeout=90s
          kubectl port-forward svc/minha-app 8080:80 &
          sleep 3
          curl --fail http://localhost:8080/health
